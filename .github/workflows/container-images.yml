name: container images

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*.*.*

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  publish:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: core
            image: whio-core
            dockerfile: docker/core.Dockerfile
          - name: ytm-resolver
            image: whio-ytm-resolver
            dockerfile: docker/ytm-resolver.Dockerfile

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: runtime
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true
          sbom: false

  promote:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [whio-core, whio-ytm-resolver]
    steps:
      - name: Require passing checks for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conclusion=$(gh api "repos/${{ github.repository }}/actions/workflows/checks.yml/runs?head_sha=${{ github.sha }}&status=completed" --jq '.workflow_runs[0].conclusion')
          test "$conclusion" = success || { echo "checks for ${{ github.sha }}: ${conclusion:-not run}"; exit 1; }

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the tested image as the release
        run: |
          image=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          docker buildx imagetools create \
            -t "$image:${{ github.ref_name }}" -t "$image:latest" \
            "$image:sha-${GITHUB_SHA::7}"
