name: whio-homelab-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: whio
      POSTGRES_USER: whio
      POSTGRES_PASSWORD: whio-dev
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whio -d whio"]
      interval: 5s
      timeout: 5s
      retries: 10

  ytm-resolver:
    build:
      context: .
      dockerfile: docker/ytm-resolver.Dockerfile
      target: dev
    volumes:
      - .:/workspace
      - ytm-resolver-venv:/opt/venv
      - ytm-deno-cache:/var/cache/deno
    ports:
      - 127.0.0.1:8000:8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  core:
    build:
      context: .
      dockerfile: docker/core.Dockerfile
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
      ytm-resolver:
        condition: service_healthy
    environment:
      WHIO_BIND_ADDRESS: 0.0.0.0:3000
      WHIO_DATABASE_URL: postgres://whio:whio-dev@postgres:5432/whio
      WHIO_CREDENTIAL_KEY: ${WHIO_CREDENTIAL_KEY:?set WHIO_CREDENTIAL_KEY in .env (openssl rand -base64 32)}
      WHIO_LOG_LEVEL: info
      WHIO_YOUTUBE_ENABLED: "true"
      WHIO_YOUTUBE_RESOLVER_URL: http://ytm-resolver:8000
      WHIO_SOURCE_TAGS: artist
      WHIO_MEDIA_ROOTS: /mnt/media/music
      WHIO_SPOOL_DIR: /var/cache/whio/spool
      CARGO_BUILD_JOBS: "2"
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - core-target:/workspace/apps/core/target
      - whio-spool:/var/cache/whio
      - /mnt/data/media/music:/mnt/media/music:ro
    ports:
      - 3100:3000

  worker:
    build:
      context: .
      dockerfile: docker/core.Dockerfile
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - cargo
      - watch
      - --poll
      - --why
      - -w
      - .
      - -w
      - ../resolver-client-generated
      - -w
      - ../subsonic-types-generated
      - -x
      - run --bin whio-worker
    environment:
      WHIO_DATABASE_URL: postgres://whio:whio-dev@postgres:5432/whio
      WHIO_CREDENTIAL_KEY: ${WHIO_CREDENTIAL_KEY:?set WHIO_CREDENTIAL_KEY in .env (openssl rand -base64 32)}
      WHIO_WORKER_QUEUES: whio.jobs.probe
      WHIO_WORKER_DRAIN_TIMEOUT_SECONDS: "30"
      WHIO_LOG_LEVEL: info
      CARGO_BUILD_JOBS: "2"
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - core-target:/workspace/apps/core/target
    stop_grace_period: 45s

volumes:
  cargo-registry:
  core-target:
  postgres-data:
  whio-spool:
  ytm-deno-cache:
  ytm-resolver-venv:
