openapi: 3.1.0

info:
  title: Whio Navidrome Connector API
  version: 1.0.0
  description: |
    Contract between the Whio core and Navidrome connector services.
    Credentials arrive per request over a private TLS hop. Upstream is
    Subsonic only; Admin paths are link-time operations outside the
    request-time contract.

servers:
  - url: /
    description: The configured connector endpoint

security: []

paths:
  /health/live:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: getLiveness
      summary: Check whether the connector process is running
      responses:
        "200":
          description: The connector process is running
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok

  /health/ready:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: getReadiness
      summary: Check whether the connector can accept requests
      responses:
        "200":
          description: The connector is ready
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
              example:
                status: ready
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/capabilities:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: getCapabilities
      summary: List the providers and capabilities exposed by this connector
      responses:
        "200":
          description: Connector capabilities
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
              example:
                contract_version: "1"
                providers:
                  - provider_id: navidrome
                    capabilities:
                      - upstream.users.list
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/catalogue/search:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: searchCatalogue
      summary: Search one upstream server library as one upstream user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
            example:
              base_url: https://music.example.test
              username: friend
              password: example-password
              query: the marias
              limit: 10
      responses:
        "200":
          description: Upstream candidates in upstream relevance order
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
              example:
                results:
                  - external_id: example-song-id
                    title: No One Noticed
                    artists:
                      - The Marias
                    duration_ms: 237000
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UpstreamAuthFailed"
        "403":
          $ref: "#/components/responses/UpstreamForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamBadResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/playback/resolve:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: resolvePlayback
      summary: Resolve one upstream song into a playable stream URL
      description: |
        Ranged-probed stream URL with token auth in the query. The caller
        fetches bytes itself; the connector never touches media.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRequest"
            example:
              base_url: https://music.example.test
              username: friend
              password: example-password
              external_id: example-song-id
      responses:
        "200":
          description: A playable stream URL for the song
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveResponse"
              example:
                url: https://music.example.test/rest/stream.view?u=friend&t=example&s=example&v=1.16.1&c=whio-nd-connector&id=example-song-id
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UpstreamAuthFailed"
        "403":
          $ref: "#/components/responses/UpstreamForbidden"
        "404":
          $ref: "#/components/responses/SourceNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamBadResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/playback/artwork:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: resolveArtwork
      summary: Resolve an upstream cover-art id into a fetchable image URL
      description: |
        Token auth in the query, like the stream URL. The connector returns the
        URL and the caller fetches the bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtworkResolveRequest"
            example:
              base_url: https://music.example.test
              username: friend
              password: example-password
              artwork_id: example-cover-art-id
      responses:
        "200":
          description: A fetchable cover-art URL
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveResponse"
              example:
                url: https://music.example.test/rest/getCoverArt.view?u=friend&t=example&s=example&v=1.16.1&c=whio-nd-connector&id=example-cover-art-id
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UpstreamAuthFailed"
        "403":
          $ref: "#/components/responses/UpstreamForbidden"
        "404":
          $ref: "#/components/responses/SourceNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamBadResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/admin/servers/verify:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: verifyUpstreamCredentials
      tags:
        - Admin
      summary: Check upstream credentials with an authenticated ping
      description: |
        Link-time credential check only. A 200 means the server accepted
        the credentials; it says nothing about privileges or catalogue
        contents.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
            example:
              base_url: https://music.example.test
              username: friend
              password: example-password
      responses:
        "200":
          description: The credentials were accepted
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"
              example:
                verified: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UpstreamAuthFailed"
        "403":
          $ref: "#/components/responses/UpstreamForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamBadResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/admin/users/list:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: listUpstreamUsers
      tags:
        - Admin
      summary: List the usernames on an upstream server using admin credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListUsersRequest"
            example:
              base_url: https://music.example.test
              admin_username: admin
              admin_password: example-password
      responses:
        "200":
          description: Upstream usernames in server order
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListUsersResponse"
              example:
                usernames:
                  - admin
                  - friend
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/UpstreamAuthFailed"
        "403":
          $ref: "#/components/responses/UpstreamForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamBadResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: An opaque request identifier to propagate when supplied.
      schema:
        $ref: "#/components/schemas/RequestId"

  headers:
    RequestId:
      required: true
      description: The supplied or connector-generated request identifier.
      schema:
        $ref: "#/components/schemas/RequestId"

  responses:
    BadRequest:
      description: The request is invalid
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: invalid_request
            message: The request is invalid
            request_id: 0198f123-4567-7abc-8def-0123456789ab

    UpstreamAuthFailed:
      description: The upstream server rejected the credentials
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: upstream_auth_failed
            message: The upstream server rejected the credentials
            request_id: 0198f123-4567-7abc-8def-0123456789ab

    UpstreamForbidden:
      description: The upstream credentials lack the required privileges
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: upstream_forbidden
            message: The upstream user lacks the required privileges
            request_id: 0198f123-4567-7abc-8def-0123456789ab

    UpstreamBadResponse:
      description: The upstream server answered with an unusable response
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: upstream_bad_response
            message: The upstream response was not understood
            request_id: 0198f123-4567-7abc-8def-0123456789ab

    ServiceUnavailable:
      description: The connector or its upstream server is temporarily unavailable
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: provider_unavailable
            message: The upstream server is temporarily unavailable
            request_id: 0198f123-4567-7abc-8def-0123456789ab

    InternalError:
      description: The connector encountered an unexpected error
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: internal_error
            message: An unexpected error occurred
            request_id: 0198f123-4567-7abc-8def-0123456789ab

    SourceNotFound:
      description: The upstream song does not exist or is no longer available
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: source_not_found
            message: The upstream song is unavailable
            request_id: 0198f123-4567-7abc-8def-0123456789ab

  schemas:
    RequestId:
      type: string
      minLength: 1
      maxLength: 128

    ContractVersion:
      type: string
      const: "1"

    ProviderId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$"
      examples:
        - navidrome

    CapabilityId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$"
      examples:
        - upstream.users.list

    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok

    ReadyResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ready

    CapabilitiesResponse:
      type: object
      additionalProperties: false
      required:
        - contract_version
        - providers
      properties:
        contract_version:
          $ref: "#/components/schemas/ContractVersion"
        providers:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ProviderCapabilities"

    ProviderCapabilities:
      type: object
      additionalProperties: false
      required:
        - provider_id
        - capabilities
      properties:
        provider_id:
          $ref: "#/components/schemas/ProviderId"
        capabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CapabilityId"

    BaseUrl:
      type: string
      minLength: 1
      maxLength: 512
      description: |
        Base URL without trailing slash. https, except http on loopback.
      examples:
        - https://music.example.test

    VerifyRequest:
      type: object
      additionalProperties: false
      required:
        - base_url
        - username
        - password
      properties:
        base_url:
          $ref: "#/components/schemas/BaseUrl"
        username:
          type: string
          minLength: 1
          maxLength: 200
        password:
          type: string
          minLength: 1
          maxLength: 500

    VerifyResponse:
      type: object
      properties:
        verified:
          type: boolean

    ListUsersRequest:
      type: object
      additionalProperties: false
      required:
        - base_url
        - admin_username
        - admin_password
      properties:
        base_url:
          $ref: "#/components/schemas/BaseUrl"
        admin_username:
          type: string
          minLength: 1
          maxLength: 200
        admin_password:
          type: string
          minLength: 1
          maxLength: 500

    ListUsersResponse:
      type: object
      additionalProperties: false
      required:
        - usernames
      properties:
        usernames:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200

    SearchRequest:
      type: object
      additionalProperties: false
      required:
        - base_url
        - username
        - password
        - query
        - limit
      properties:
        base_url:
          $ref: "#/components/schemas/BaseUrl"
        username:
          type: string
          minLength: 1
          maxLength: 200
        password:
          type: string
          minLength: 1
          maxLength: 500
        query:
          type: string
          minLength: 1
          maxLength: 500
        limit:
          type: integer
          minimum: 1
          maximum: 25
        offset:
          type: integer
          minimum: 0
          maximum: 1000
          default: 0

    SearchResponse:
      type: object
      additionalProperties: false
      required:
        - results
      properties:
        next_offset:
          type: integer
          minimum: 1
          maximum: 1000
          description: Next upstream offset, before filtering results. Absent when the bounded search is exhausted.
        results:
          type: array
          items:
            $ref: "#/components/schemas/UpstreamCandidate"
    UpstreamCandidate:
      type: object
      additionalProperties: false
      required:
        - external_id
        - title
        - artists
      properties:
        external_id:
          type: string
          minLength: 1
          maxLength: 512
        title:
          type: string
          minLength: 1
          maxLength: 500
        artists:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
            maxLength: 500
        duration_ms:
          type:
            - integer
            - "null"
          minimum: 0
        album:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 500
        artwork_id:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 512
          description: The upstream cover-art id, resolved through resolveArtwork.

    ResolveRequest:
      type: object
      additionalProperties: false
      required:
        - base_url
        - username
        - password
        - external_id
      properties:
        base_url:
          $ref: "#/components/schemas/BaseUrl"
        username:
          type: string
          minLength: 1
          maxLength: 200
        password:
          type: string
          minLength: 1
          maxLength: 500
        external_id:
          type: string
          minLength: 1
          maxLength: 512

    ResolveResponse:
      type: object
      additionalProperties: false
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048

    ArtworkResolveRequest:
      type: object
      additionalProperties: false
      required:
        - base_url
        - username
        - password
        - artwork_id
      properties:
        base_url:
          $ref: "#/components/schemas/BaseUrl"
        username:
          type: string
          minLength: 1
          maxLength: 200
        password:
          type: string
          minLength: 1
          maxLength: 500
        artwork_id:
          type: string
          minLength: 1
          maxLength: 512

    ErrorCode:
      type: string
      enum:
        - invalid_request
        - source_not_found
        - upstream_auth_failed
        - upstream_forbidden
        - upstream_bad_response
        - provider_unavailable
        - internal_error

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - request_id
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          minLength: 1
          maxLength: 500
        request_id:
          $ref: "#/components/schemas/RequestId"
