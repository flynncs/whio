openapi: 3.1.0

info:
  title: Whio Resolver API
  version: 1.0.0
  description: |
    Contract between the Whio core and resolver services.

servers:
  - url: /
    description: The configured resolver endpoint

security: []

paths:
  /health/live:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: getLiveness
      summary: Check whether the resolver process is running
      responses:
        "200":
          description: The resolver process is running
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok

  /health/ready:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: getReadiness
      summary: Check whether the resolver can accept requests
      responses:
        "200":
          description: The resolver is ready
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
              example:
                status: ready
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/capabilities:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: getCapabilities
      summary: List the providers and capabilities exposed by this resolver
      responses:
        "200":
          description: Resolver capabilities
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
              example:
                contract_version: "1"
                providers:
                  - provider_id: example_music
                    capabilities:
                      - catalogue.search
                      - playback.resolve
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/catalogue/search:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: searchCatalogue
      summary: Search the catalogues exposed by this resolver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogueSearchRequest"
            example:
              query: Instant Crush
              limit: 5
      responses:
        "200":
          description: Normalized catalogue candidates
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueSearchResponse"
              example:
                results:
                  - source:
                      provider_id: example_music
                      external_id: example-source-id
                    title: Instant Crush
                    artists:
                      - name: Daft Punk
                        source:
                          provider_id: example_music
                          external_id: example-artist-id
                    duration_ms: 337000
                    album:
                      title: Random Access Memories
                      source:
                        provider_id: example_music
                        external_id: example-album-id
                      year: 2013
                      release_type: Album
                    artwork_url: https://art.example.test/random-access-memories.jpg
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/catalogue/album-search:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: searchCatalogueAlbums
      summary: Search provider albums
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogueSearchRequest"
      responses:
        "200":
          description: Normalized provider album candidates
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueAlbumSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/catalogue/artist-search:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: searchCatalogueArtists
      summary: Search provider artists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogueSearchRequest"
      responses:
        "200":
          description: Normalized provider artist candidates
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueArtistSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/catalogue/artist:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: fetchCatalogueArtist
      summary: Fetch an artist's albums and singles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogueEntityRequest"
      responses:
        "200":
          description: Normalized artist album candidates
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueArtistAlbumsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/SourceNotFound"
        "422":
          $ref: "#/components/responses/UnsupportedProvider"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/catalogue/album:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: fetchCatalogueAlbum
      summary: Fetch one album's full tracklist by its provider identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogueEntityRequest"
            example:
              source:
                provider_id: example_music
                external_id: example-album-id
      responses:
        "200":
          description: The album's normalized tracks
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogueCandidatesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/SourceNotFound"
        "422":
          $ref: "#/components/responses/UnsupportedProvider"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/metadata/artist/display:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: fetchArtistMetadata
      summary: Fetch one addressed artist source document as per-field candidates
      description: |
        One core operation per addressed source, profile and language. The
        resolver answers with every candidate it can produce for that address and
        independent per-field errors; it never merges two upstreams into one
        value. Each candidate names the upstream that produced it, so the core can
        record a per-fact licence and attribution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataArtistDocumentRequest"
            example:
              source:
                provider_id: musicbrainz
                external_id: b7ffd2af-418f-4be2-bdd1-22f8b48613da
              language: en
              profile: artist-display.v1
      responses:
        "200":
          description: The addressed source document's normalized candidates
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataArtistDocumentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/SourceNotFound"
        "422":
          $ref: "#/components/responses/UnsupportedProvider"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/playback/resolve:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: resolvePlayback
      summary: Resolve one provider source into temporary playable media
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackResolveRequest"
            example:
              source:
                provider_id: example_music
                external_id: example-source-id
      responses:
        "200":
          description: A short-lived playable representation of the source
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackResolveResponse"
              example:
                url: https://media.example.test/audio
                headers:
                  User-Agent: resolver-example
                expires_at: "2026-07-28T12:00:00Z"
                media:
                  content_type: audio/webm
                  codec: opus
                  bitrate_kbps: 128.5
                  duration_ms: 337250
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/SourceNotFound"
        "422":
          $ref: "#/components/responses/UnsupportedProvider"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/ResolutionFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: An opaque request identifier to propagate when supplied.
      schema:
        $ref: "#/components/schemas/RequestId"

  headers:
    RequestId:
      required: true
      description: The supplied or resolver-generated request identifier.
      schema:
        $ref: "#/components/schemas/RequestId"

  responses:
    BadRequest:
      description: The request is invalid
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: invalid_request
            message: The request is invalid
            request_id: 0198f123-4567-7abc-8def-0123456789ab

    SourceNotFound:
      description: The source does not exist or is no longer available
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: source_not_found
            message: The source is unavailable
            request_id: 0198f123-4567-7abc-8def-0123456789ab

    UnsupportedProvider:
      description: The resolver does not support the requested provider
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: unsupported_provider
            message: The provider is not supported
            request_id: 0198f123-4567-7abc-8def-0123456789ab

    ResolutionFailed:
      description: The provider could not resolve the source
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: resolution_failed
            message: Playback could not be resolved
            request_id: 0198f123-4567-7abc-8def-0123456789ab

    ServiceUnavailable:
      description: The resolver or its provider is temporarily unavailable
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: provider_unavailable
            message: The provider is temporarily unavailable
            request_id: 0198f123-4567-7abc-8def-0123456789ab

    InternalError:
      description: The resolver encountered an unexpected error
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: internal_error
            message: An unexpected error occurred
            request_id: 0198f123-4567-7abc-8def-0123456789ab

  schemas:
    RequestId:
      type: string
      minLength: 1
      maxLength: 128

    ContractVersion:
      type: string
      const: "1"

    ProviderId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$"
      examples:
        - example_music

    CapabilityId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$"
      examples:
        - catalogue.search
        - catalogue.album-search
        - catalogue.artist-search
        - catalogue.artist
        - playback.resolve

    SourceIdentity:
      type: object
      additionalProperties: false
      required:
        - provider_id
        - external_id
      properties:
        provider_id:
          $ref: "#/components/schemas/ProviderId"
        external_id:
          type: string
          minLength: 1
          maxLength: 512

    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok

    ReadyResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ready

    CapabilitiesResponse:
      type: object
      additionalProperties: false
      required:
        - contract_version
        - providers
      properties:
        contract_version:
          $ref: "#/components/schemas/ContractVersion"
        providers:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ProviderCapabilities"

    ProviderCapabilities:
      type: object
      additionalProperties: false
      required:
        - provider_id
        - capabilities
      properties:
        provider_id:
          $ref: "#/components/schemas/ProviderId"
        capabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CapabilityId"

    CatalogueSearchRequest:
      type: object
      additionalProperties: false
      required:
        - query
        - limit
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 500
        limit:
          type: integer
          minimum: 1
          maximum: 25
        offset:
          type: integer
          minimum: 0
          maximum: 1000
          default: 0

    CatalogueAlbumSearchResponse:
      type: object
      additionalProperties: false
      required:
        - results
      properties:
        next_offset:
          type: integer
          minimum: 1
          maximum: 1000
        results:
          type: array
          items:
            $ref: "#/components/schemas/CatalogueAlbumCandidate"

    CatalogueArtistSearchResponse:
      type: object
      additionalProperties: false
      required:
        - results
      properties:
        next_offset:
          type: integer
          minimum: 1
          maximum: 1000
        results:
          type: array
          items:
            $ref: "#/components/schemas/CatalogueArtistCandidate"

    CatalogueArtistAlbumsResponse:
      type: object
      additionalProperties: false
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/CatalogueAlbumCandidate"

    CatalogueAlbumCandidate:
      type: object
      additionalProperties: false
      required:
        - source
        - title
        - artists
      properties:
        source:
          $ref: "#/components/schemas/SourceIdentity"
        title:
          type: string
          minLength: 1
          maxLength: 500
        artists:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CatalogueArtist"
        year:
          type:
            - integer
            - "null"
          minimum: 0
        release_type:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 100
        artwork_url:
          type:
            - string
            - "null"
          format: uri
          description: Public artwork URL that the core fetches and proxies to clients.

    CatalogueArtistCandidate:
      type: object
      additionalProperties: false
      required:
        - source
        - name
      properties:
        source:
          $ref: "#/components/schemas/SourceIdentity"
        name:
          type: string
          minLength: 1
          maxLength: 500

    CatalogueSearchResponse:
      type: object
      additionalProperties: false
      required:
        - results
      properties:
        next_offset:
          type: integer
          minimum: 1
          maximum: 1000
          description: Next upstream offset, before filtering results. Absent when the bounded search is exhausted.
        results:
          type: array
          items:
            $ref: "#/components/schemas/CatalogueCandidate"

    CatalogueCandidate:
      type: object
      additionalProperties: false
      required:
        - source
        - title
        - artists
      properties:
        source:
          $ref: "#/components/schemas/SourceIdentity"
        title:
          type: string
          minLength: 1
          maxLength: 500
        artists:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CatalogueArtist"
        duration_ms:
          type:
            - integer
            - "null"
          minimum: 0
        album:
          $ref: "#/components/schemas/CatalogueAlbum"
        artwork_url:
          type:
            - string
            - "null"
          format: uri
          description: Public artwork URL that the core fetches and proxies to clients.

    CatalogueArtist:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 500
        source:
          $ref: "#/components/schemas/SourceIdentity"
          description: The artist's identity at the provider, when the provider supplies one. Absent for a name-only credit.

    CatalogueAlbum:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        source:
          $ref: "#/components/schemas/SourceIdentity"
          description: The album's identity at the provider, when the provider supplies one.
        year:
          type:
            - integer
            - "null"
          minimum: 0
        release_type:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 100
        artwork_url:
          type:
            - string
            - "null"
          format: uri
          description: Public artwork URL that the core fetches and proxies to clients.

    CatalogueEntityRequest:
      type: object
      additionalProperties: false
      required:
        - source
      properties:
        source:
          $ref: "#/components/schemas/SourceIdentity"

    CatalogueCandidatesResponse:
      type: object
      additionalProperties: false
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/CatalogueCandidate"
        reported_count:
          type:
            - integer
            - "null"
          minimum: 0
          description: The provider's reported number of tracks for the fetched entity, when it reports one. Completeness compares the materialised member count against this.

    PlaybackResolveRequest:
      type: object
      additionalProperties: false
      required:
        - source
      properties:
        source:
          $ref: "#/components/schemas/SourceIdentity"

    PlaybackResolveResponse:
      type: object
      additionalProperties: false
      required:
        - url
        - headers
        - media
      properties:
        url:
          type: string
          format: uri
        headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type:
            - string
            - "null"
          format: date-time
        media:
          $ref: "#/components/schemas/MediaMetadata"

    MediaMetadata:
      type: object
      additionalProperties: false
      properties:
        content_type:
          type:
            - string
            - "null"
          minLength: 1
        content_length_bytes:
          type:
            - integer
            - "null"
          minimum: 0
        codec:
          type:
            - string
            - "null"
          minLength: 1
        bitrate_kbps:
          type:
            - number
            - "null"
          exclusiveMinimum: 0
        duration_ms:
          type:
            - integer
            - "null"
          minimum: 0

    MetadataProfile:
      type: string
      const: artist-display.v1

    MetadataFieldId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[a-z][a-z0-9_]*(?:\\.[a-z0-9_]+)*$"
      examples:
        - biography.content
        - image.portrait

    MetadataLanguage:
      type: string
      minLength: 2
      maxLength: 35

    MetadataArtistDocumentRequest:
      type: object
      additionalProperties: false
      required:
        - source
        - profile
      properties:
        source:
          $ref: "#/components/schemas/SourceIdentity"
        language:
          $ref: "#/components/schemas/MetadataLanguage"
        profile:
          $ref: "#/components/schemas/MetadataProfile"
        fields:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/MetadataFieldId"
          description: The requested field subset. Absent means every field the profile covers.

    MetadataArtistDocumentResponse:
      type: object
      additionalProperties: false
      required:
        - address
        - retrieved_at
        - candidates
        - errors
      properties:
        address:
          $ref: "#/components/schemas/SourceIdentity"
          description: The addressed identity. It must equal the request's source or the response is discarded.
        source_revision:
          type:
            - string
            - "null"
          maxLength: 256
          description: The producing source's own revision, when it supplies one.
        retrieved_at:
          type: string
          format: date-time
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/MetadataFieldCandidate"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/MetadataFieldError"

    CandidateSource:
      type: object
      additionalProperties: false
      required:
        - provider_id
        - external_id
        - match_basis
      properties:
        provider_id:
          $ref: "#/components/schemas/ProviderId"
        external_id:
          type: string
          minLength: 1
          maxLength: 512
        source_scope:
          type:
            - string
            - "null"
          maxLength: 512
          description: The provider's own scope for the identity, when it has one.
        url:
          type:
            - string
            - "null"
          format: uri
          maxLength: 2048
        match_basis:
          type: string
          enum:
            - identifier
            - established_source
          description: How the candidate's identity was matched. A name match is not a basis.

    MetadataFieldCandidate:
      type: object
      additionalProperties: false
      required:
        - field
        - source
        - licence
      properties:
        field:
          $ref: "#/components/schemas/MetadataFieldId"
        source:
          $ref: "#/components/schemas/CandidateSource"
          description: The upstream that produced this value, not the addressed provider.
        text:
          type:
            - string
            - "null"
          maxLength: 65536
        count:
          type:
            - integer
            - "null"
          minimum: 0
        reference:
          type:
            - string
            - "null"
          format: uri
          maxLength: 2048
        candidates:
          type:
            - array
            - "null"
          maxItems: 100
          items:
            $ref: "#/components/schemas/MetadataCandidate"
        image:
          oneOf:
            - $ref: "#/components/schemas/ImageDescriptor"
            - type: "null"
        language:
          oneOf:
            - $ref: "#/components/schemas/MetadataLanguage"
            - type: "null"
        rank:
          type:
            - integer
            - "null"
          minimum: 0
        score:
          type:
            - number
            - "null"
        metric:
          oneOf:
            - $ref: "#/components/schemas/MetricDescriptor"
            - type: "null"
        ranking_scope:
          type:
            - string
            - "null"
          maxLength: 200
          description: The named ranking a list field came from (for example a pinned similarity algorithm id), recorded verbatim per candidate. A ranking whose basis cannot be named must not be served.
        licence:
          $ref: "#/components/schemas/LicenceDescriptor"
        attribution:
          oneOf:
            - $ref: "#/components/schemas/Attribution"
            - type: "null"

    MetadataCandidate:
      type: object
      additionalProperties: false
      required:
        - source
        - name
      properties:
        source:
          $ref: "#/components/schemas/CandidateSource"
        name:
          type: string
          minLength: 1
          maxLength: 500
        artists:
          type:
            - array
            - "null"
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 500
        release_name:
          type:
            - string
            - "null"
