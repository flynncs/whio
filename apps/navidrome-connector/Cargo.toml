[package]
name = "navidrome-connector"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "navidrome-connector"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.24.1", features = ["v7"] }
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "rustls",
] }
md-5 = "0.10"
hex = "0.4"
form_urlencoded = "1"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
