[package]
name = "whio-navidrome-connector-api"
version = "0.1.0"
authors = ["OpenAPI Generator team and contributors"]
description = "Contract between the Whio core and Navidrome connector services. Credentials arrive per request over a private TLS hop. Upstream is Subsonic only; Admin paths are link-time operations outside the request-time contract. "
# Override this license by providing a License Object in the OpenAPI.
license = "Unlicense"
edition = "2021"

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_with = { version = "^3.8", default-features = false, features = ["base64", "std", "macros"] }
serde_json = "^1.0"
serde_repr = "^0.1"
serde_path_to_error = "^0.1"
url = "^2.5"
reqwest = { version = "^0.13", default-features = false, features = ["json", "multipart", "query", "form"] }

[features]
default = []
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]
