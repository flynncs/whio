[package]
name = "whio-core"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "whio-api"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.24.0", features = ["v7"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
async-trait = "0.1"
whio-resolver-api = { path = "../resolver-client-generated", default-features = false, features = ["rustls"] }
chrono = "0.4.45"
url = "2.5"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
serde_json = "1.0"
