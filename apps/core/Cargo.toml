[package]
name = "whio-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
default-run = "whio-api"

[features]
postgres-integration = []

[[bin]]
name = "whio-api"
path = "src/main.rs"

[[bin]]
name = "whio-cli"
path = "src/bin/whio-cli.rs"

[dependencies]
axum = "0.8.9"
bytes = "1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "signal",
    "sync",
    "fs",
    "io-util",
] }
tokio-stream = "0.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.24.1", features = ["v7"] }
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "rustls",
    "stream",
] }
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "migrate",
    "macros",
    "uuid",
    "chrono",
] }
async-trait = "0.1.92"
aws-lc-rs = "1"
base64 = "0.22"
form_urlencoded = "1"
hex = "0.4"
md-5 = "0.10"
sha2 = "0.10"
subtle = "2"
whio-resolver-api = { path = "../resolver-client-generated", default-features = false, features = [
    "rustls",
] }
whio-subsonic-api = { path = "../subsonic-types-generated" }
chrono = "0.4.45"
url = "2.5.8"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
serde_json = "1.0.151"

[profile.release]
strip = true
lto = "thin"
panic = "abort"
